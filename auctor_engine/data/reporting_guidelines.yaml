schema_version: 1.0.0
currency_date: '2026-08-13'
name: Auctor Reporting Guideline Registry
scope_note: Coverage proxies are original Auctor checks. They do not reproduce an official checklist, do not establish compliance,
  and must be confirmed against the current source guideline.
profiles:
  consort_2025:
    title: CONSORT Statement
    version: '2025'
    manuscript_kind: completed_study
    official_url: https://www.equator-network.org/reporting-guidelines/consort/
    applies_to:
    - completed randomised trials
    aliases:
    - randomized controlled trial
    - randomised controlled trial
    - randomized trial
    - randomised trial
    - clinical trial report
    coverage_proxies:
    - id: TITLE-DESIGN
      section: title
      concept_groups:
      - - randomi[sz]ed
      - - \btrial\b
      requirement: Identify the report as a randomised trial in the title.
      action: Confirm the exact design label in the title.
      severity: medium
      confidence: 0.72
    - id: METHODS-RANDOM
      section: methods
      concept_groups:
      - - random sequence|sequence generation|computer.generated|random number
      - - allocation conceal|central randomi[sz]ation|sealed envelope
      requirement: Describe sequence generation and allocation concealment.
      action: Confirm who generated and concealed allocation, and how.
      severity: medium
      confidence: 0.64
    - id: METHODS-OUTCOME
      section: methods
      concept_groups:
      - - primary outcome|primary endpoint
      - - sample size|power calculation|target difference
      requirement: Define the primary outcome and justify sample size.
      action: Confirm outcome timing, metric, analysis, and sample-size assumptions.
      severity: medium
      confidence: 0.62
    - id: RESULTS-FLOW
      section: results
      concept_groups:
      - - randomi[sz]ed|assigned|allocated
      - - analysed|analyzed|included in the analysis|follow.up
      requirement: Report participant flow from allocation to analysis.
      action: Reconcile randomised, treated, followed, and analysed denominators.
      severity: medium
      confidence: 0.6
    - id: RESULTS-ESTIMATE
      section: results
      concept_groups:
      - - \d
      - - 95\s*%?\s*(?:CI|confidence interval)|credible interval
      requirement: Report effect magnitude with uncertainty.
      action: Add the prespecified effect measure, estimate, and uncertainty interval.
      severity: medium
      confidence: 0.65
    - id: WHOLE-REGISTRATION
      section: whole
      concept_groups:
      - - NCT\d{8}|ISRCTN\d{8}|ACTRN\d{14}|trial registration|registration number
      - - protocol|statistical analysis plan|SAP
      requirement: Make registration and protocol access traceable.
      action: Provide stable registration and protocol or analysis-plan identifiers.
      severity: info
      confidence: 0.55
  spirit_2025:
    title: SPIRIT Statement
    version: '2025'
    manuscript_kind: protocol
    official_url: https://www.equator-network.org/reporting-guidelines/spirit-2013-statement-defining-standard-protocol-items-for-clinical-trials/
    applies_to:
    - clinical trial protocols
    aliases:
    - trial protocol
    - randomized trial protocol
    - randomised trial protocol
    - clinical trial protocol
    - study protocol
    coverage_proxies:
    - id: TITLE-PROTOCOL
      section: title
      concept_groups:
      - - \bprotocol\b
      - - \btrial\b
      requirement: Identify the article as a trial protocol.
      action: State that the manuscript is a protocol and name the trial design.
      severity: medium
      confidence: 0.72
    - id: METHODS-OBJECTIVES
      section: methods
      concept_groups:
      - - primary objective|primary aim|primary hypothesis
      - - primary outcome|primary endpoint
      requirement: Link objectives to prespecified outcomes.
      action: State the primary objective, outcome definition, metric, and time point.
      severity: medium
      confidence: 0.64
    - id: METHODS-ASSIGNMENT
      section: methods
      concept_groups:
      - - random sequence|sequence generation
      - - allocation conceal|implementation
      - - blind|mask
      requirement: Describe assignment and masking procedures.
      action: Specify generation, concealment, implementation roles, and masking.
      severity: medium
      confidence: 0.6
    - id: METHODS-DATA
      section: methods
      concept_groups:
      - - data management|data collection
      - - monitoring|data monitoring committee|harms|adverse event
      requirement: Describe data handling, monitoring, and harms oversight.
      action: Confirm data-management, monitoring, stopping, and harms procedures.
      severity: info
      confidence: 0.52
    - id: WHOLE-GOVERNANCE
      section: whole
      concept_groups:
      - - ethics|ethical approval|institutional review board
      - - consent|informed consent
      - - registration|NCT\d{8}|ISRCTN\d{8}
      requirement: Make ethics, consent, and registration traceable.
      action: Supply named approvals, consent procedures, and registration identifier.
      severity: medium
      confidence: 0.58
  strobe:
    title: STROBE Statement
    version: current core checklist
    manuscript_kind: completed_study
    official_url: https://www.strobe-statement.org/checklists/
    applies_to:
    - cohort studies
    - case-control studies
    - cross-sectional studies
    aliases:
    - cohort study
    - prospective cohort
    - retrospective cohort
    - case control
    - case-control
    - cross sectional
    - cross-sectional
    - observational study
    coverage_proxies:
    - id: TITLE-DESIGN
      section: title
      concept_groups:
      - - cohort|case.control|cross.section|observational
      requirement: Identify the observational design.
      action: Name the design in the title or abstract.
      severity: info
      confidence: 0.64
    - id: METHODS-SETTING
      section: methods
      concept_groups:
      - - setting|site|hospital|community|country
      - - \b20\d{2}\b|recruitment period|study period
      requirement: Report setting, locations, and relevant dates.
      action: Add sites, calendar period, recruitment, exposure, and follow-up dates.
      severity: medium
      confidence: 0.55
    - id: METHODS-VARIABLES
      section: methods
      concept_groups:
      - - exposure|predictor|risk factor
      - - outcome
      - - confound|covariate|adjust
      requirement: Define variables and confounding control.
      action: Define exposures, outcomes, effect modifiers, and confounder selection.
      severity: medium
      confidence: 0.58
    - id: METHODS-BIAS
      section: methods
      concept_groups:
      - - bias|misclassification|selection
      - - missing data|multiple imputation|complete case
      requirement: Describe bias controls and missing-data handling.
      action: Name expected bias pathways and the missing-data strategy.
      severity: medium
      confidence: 0.58
    - id: RESULTS-DENOM
      section: results
      concept_groups:
      - - eligible|included|excluded|participant
      - - \bn\s*=|among\s+\d+|\d+ participants|\d+ records
      requirement: Reconcile participant or record denominators.
      action: Report numbers at each stage and reasons for exclusion.
      severity: medium
      confidence: 0.58
    - id: DISCUSSION-GENERAL
      section: discussion
      concept_groups:
      - - generaliz|generalis|transportab|applicab
      - - limitation|bias|precision|residual confounding
      requirement: Bound interpretation and generalisability.
      action: State how bias, precision, and setting affect the conclusion and target population.
      severity: info
      confidence: 0.52
  prisma_2020:
