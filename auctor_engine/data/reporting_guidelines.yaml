    aliases:
    - prediction model
    - prognostic model
    - diagnostic model
    - machine learning prediction
    - artificial intelligence model
    - model validation
    coverage_proxies:
    - id: TITLE-MODEL
      section: title
      concept_groups:
      - - predict|prognos|diagnos
      - - develop|validat|updat|evaluat
      requirement: Identify prediction purpose and model phase.
      action: Name the target population, predicted outcome, and whether the model was developed, validated, or updated.
      severity: medium
      confidence: 0.65
    - id: METHODS-DATA
      section: methods
      concept_groups:
      - - data source|cohort|registry|electronic health record
      - - eligib|participant|sample
      - - outcome|target
      requirement: Define data source, participants, and target outcome.
      action: State data provenance, eligibility, setting, dates, and outcome assessment.
      severity: medium
      confidence: 0.58
    - id: METHODS-MODEL
      section: methods
      concept_groups:
      - - predictor|feature
      - - missing data|imputation
      - - model|algorithm
      - - validation|resampling|bootstrap|cross.validation
      requirement: Make model development and validation reproducible.
      action: Describe predictor handling, missingness, modelling, tuning, and internal or external validation.
      severity: medium
      confidence: 0.61
    - id: RESULTS-PERFORMANCE
      section: results
      concept_groups:
      - - discrimination|AUC|c.statistic
      - - calibration
      - - confidence interval|95\s*%?\s*CI|uncertainty
      requirement: Report performance across discrimination, calibration, and uncertainty.
      action: Report all prespecified performance measures with intervals and evaluation sample size.
      severity: medium
      confidence: 0.64
    - id: WHOLE-AVAILABILITY
      section: whole
      concept_groups:
      - - model equation|code|repository|GitHub|weights|intercept|calculator
      - - data availab|access
      requirement: State how the model and data can be accessed or why access is restricted.
      action: Record executable model details, code, and data-access conditions.
      severity: info
      confidence: 0.5
