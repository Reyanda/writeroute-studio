      - - systematic review|meta.analysis
      requirement: Identify the work as a systematic review or meta-analysis.
      action: Use the precise review type in the title.
      severity: medium
      confidence: 0.75
    - id: METHODS-ELIGIBILITY
      section: methods
      concept_groups:
      - - eligibility|inclusion criteria|exclusion criteria
      - - information source|database|MEDLINE|Embase|Web of Science
      requirement: State eligibility and information sources.
      action: Specify review criteria, databases, platforms, and coverage dates.
      severity: medium
      confidence: 0.65
    - id: METHODS-SEARCH
      section: methods
      concept_groups:
      - - search strategy|search terms|search string
      - - last search|searched on|search date|\b20\d{2}\b
      requirement: Make the search reproducible and dated.
      action: Provide complete strategies or a stable supplement and the final search date.
      severity: medium
      confidence: 0.62
    - id: METHODS-PROCESS
      section: methods
      concept_groups:
      - - screen|selection process
      - - data extraction|data collection
      - - risk of bias|quality appraisal
      requirement: Describe selection, extraction, and appraisal.
      action: State reviewer numbers, independence, resolution, and tools.
      severity: medium
      confidence: 0.6
    - id: RESULTS-FLOW
      section: results
      concept_groups:
      - - identified|records
      - - screened
      - - included
      - - excluded
      requirement: Report study flow and exclusions.
      action: Reconcile counts and link to a flow diagram with full-text exclusion reasons.
      severity: medium
      confidence: 0.62
    - id: WHOLE-REGISTRATION
      section: whole
      concept_groups:
      - - PROSPERO|CRD420\d{6,}|registration|protocol
      requirement: Report registration or explain its absence.
      action: Give the registry identifier and protocol location, or a transparent explanation.
      severity: info
      confidence: 0.58
  tripod_ai_2024:
    title: TRIPOD+AI Statement
    version: '2024'
    manuscript_kind: completed_study
    official_url: https://www.tripod-statement.org/
    applies_to:
