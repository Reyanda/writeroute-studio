schema_version: 2.0.0
name: Scientific Authorship & Evidence Quality Pattern Lookup
short_name: SAEQ-PL v2
purpose: Detect revision-worthy clusters of LLM-associated style and scientific-writing defects. The system does not infer
  whether a person used AI and does not return an AI-authorship probability.
non_goals:
- Authorship attribution or academic-misconduct adjudication
- Punishing isolated words, non-native English, or discipline-standard phrasing
- Replacing methodological, statistical, or subject-matter review
- Claiming that fluent or formal prose is inherently artificial
output_contract:
  scores:
  - name: style_pattern_burden
    meaning: Density and interaction of LLM-associated or templated style signals; not AI probability.
  - name: scientific_quality_risk
    meaning: Revision priority arising from specificity, epistemic, inferential, or reporting defects.
  - name: integrity_risk
    meaning: Prompt leakage, placeholders, or cross-document inconsistencies requiring verification.
  authorship: not_inferred
  finding_fields:
  - rule_id
  - span
  - section
  - why
  - evidence_tier
  - severity
  - confidence
  - guards_applied
  - revision
evidence_tiers:
  A: Empirical association reported in peer-reviewed or primary corpus research; still not individual-level authorship evidence.
  B: Established scientific-writing or reporting defect, not specific to AI.
  C: Heuristic pattern requiring local corpus calibration and conservative interpretation.
scoring:
  principle: Score revision priority, not probability of AI use.
  severity_points:
    info: 1.0
    low: 2.0
    medium: 4.0
    high: 7.0
    critical: 10.0
  evidence_weights:
    A: 1.0
    B: 0.9
    C: 0.55
  dimension_scales:
    style_pattern_burden: 20.0
    scientific_quality_risk: 24.0
    integrity_risk: 12.0
  rule_repetition: 'Within each rule, use diminishing returns: first finding full weight; subsequent findings weighted by
    1/sqrt(rank).'
  score_transform: 100 * (1 - exp(-weighted_points / dimension_scale))
  short_text_confidence:
    under_80_words: 0.45
    80_to_149_words: 0.6
    150_to_299_words: 0.8
    300_or_more_words: 1.0
  bands:
    0-19: low
    20-39: guarded
    40-59: moderate
    60-79: high
    80-100: very_high
section_model:
  canonical_sections:
  - title
  - abstract
  - introduction
  - methods
  - results
  - discussion
  - limitations
  - conclusion
  - references
  - other
  excluded_by_default:
  - references
  - bibliography
  - acknowledgements
  - supplementary_references
  principle: Thresholds and harms differ by section. Passive voice, nominalization, and hedging can be appropriate in Methods
    but harmful when stacked in Conclusions.
global_false_positive_controls:
- Never classify authorship from a single lexical item.
- Mask quotations, code, reference lists, and editorial examples where possible.
- Treat short texts as low-confidence.
- Apply literal-sense and technical-term suppressors, including robust standard errors, robustness analysis, ecological landscape,
  and pivotal trial.
- Distinguish statistical significance from importance and from the ordinary meaning of significant.
- Permit calibrated hedging; flag redundancy, stacking, or mismatch with evidence.
- Calibrate syntax and rhythm metrics within discipline, journal genre, section, year, and language background before institutional
  use.
- Never use the output as sole evidence in misconduct, grading, hiring, or peer-review decisions.
