version: 1.0.0
coverage_note: Registry entries route reviews and define minimum checks. Registration
  does not imply that one method is preferred over alternatives.
families:
  descriptive_and_design_based:
    task_classes: &id001
    - description
    minimum_review: &id002
    - target_population
    - denominator
    - sampling_design
    - weighting
    - missingness
    - uncertainty
    common_hazards: &id003
    - wrong_denominator
    - unweighted_complex_sample
    - noncomparable_standard_population
    - ecological_interpretation
  classical_inference_and_regression:
    task_classes: &id004
    - description
    - association
    - prediction
    minimum_review: &id005
    - estimand_or_parameter
    - sampling_model
    - assumptions
    - effect_scale
    - uncertainty
    - diagnostics
    common_hazards: &id006
    - model_misspecification
    - nonindependence
    - dichotomania
    - multiplicity
    - noncollapsibility
    - overadjustment
  bayesian_methods:
    task_classes: &id007
    - description
    - association
    - prediction
    - causal_effect
    - decision
    minimum_review: &id008
    - likelihood
    - prior
    - posterior_target
    - computation
    - convergence
    - posterior_predictive_check
    - sensitivity
    common_hazards: &id009
    - prior_dominance
    - nonconvergence
    - divergences
    - label_switching
    - posterior_summary_mismatch
    - implicit_model_selection
  causal_inference:
    task_classes: &id010
    - causal_effect
    - decision
    minimum_review: &id011
    - target_trial_or_intervention
    - estimand
    - causal_model
    - identification
    - estimator
    - positivity
    - diagnostics
    - sensitivity
    common_hazards: &id012
    - undefined_intervention
    - conditioning_on_collider
    - time_zero_misalignment
    - positivity_failure
    - post_treatment_adjustment
    - causal_language_without_identification
