epistemic_classes:
  known_error: A contradiction with definitions, algebra, design, or established identification
    logic.
  consensus_requirement: A broadly accepted minimum for valid interpretation or reporting.
  context_dependent: Several defensible choices exist and the correct choice depends
    on the target or loss function.
  active_debate: Methodologists disagree about foundations, diagnostics, or preferred
    practice.
  not_identifiable: The stated target cannot be learned from the observed data without
    additional assumptions or information.
  not_assessable: The manuscript or supplied artifacts do not contain enough information
    for a verdict.
  informational: A useful clarification that does not itself imply a defect.
review_modes:
  screen: Fast hard-gate and high-yield coherence checks.
  full: All applicable deterministic and text checks, plus manual review prompts.
  forensic: Full review with cross-section contradiction, numerical reconciliation,
    and code or result artifact checks.
  protocol: Prospective design and analysis review before outcome inspection.
  replication: Reproducibility and computational verification against executable artifacts.
