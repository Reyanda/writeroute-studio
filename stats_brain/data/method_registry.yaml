version: 1.0.0
coverage_note: Extensible routing registry. Every entry names a statistical procedure,
  but only enriched entries contain method-specific assumptions and diagnostics. Generic
  registration is not evidence that STATS-BRAIN can fully adjudicate that method without
  a custom contract or semantic expert review.
